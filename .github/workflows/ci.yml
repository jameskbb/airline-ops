name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts app.py
      - name: Test
        run: pytest -q
      - name: Smoke-test the analytical layer
        # The committed Parquet layer must load and reconcile with its data-quality reports.
        run: python -c "from flightops.data.pipeline import reconcile; print(len(reconcile()), 'months reconciled')"
