name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts app.py
      - name: Test
        run: python -m pytest -q
      - name: Smoke-test the analytical layer
        # The committed Parquet layer must load and reconcile with its data-quality reports.
        run: python -c "from flightops.data.pipeline import reconcile; print(len(reconcile()), 'months reconciled')"
