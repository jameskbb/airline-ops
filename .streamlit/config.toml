[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "stacktrace"

[theme]
base = "dark"
primaryColor = "#4c93ea"
backgroundColor = "#0b0f14"
secondaryBackgroundColor = "#121821"
textColor = "#e6e9ee"
linkColor = "#7fb2f0"
borderColor = "#222b36"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.sidebar]
backgroundColor = "#0e131a"
secondaryBackgroundColor = "#151c26"
borderColor = "#1d2530"
