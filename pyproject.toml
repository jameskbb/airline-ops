[project]
name = "flightops-intelligence"
version = "1.0.0"
description = "U.S. airline operations and network performance intelligence built on BTS on-time data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.50",
    "duckdb>=1.3",
    "polars>=1.30",
    "pandas>=2.2",
    "pyarrow>=18",
    "plotly>=6.0",
    "pydeck>=0.9",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
llm = ["anthropic>=0.60"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
